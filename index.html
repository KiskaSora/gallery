<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P={x:'M6 6l12 12M18 6L6 18',l:'M15 5l-7 7 7 7',r:'M9 5l7 7-7 7',h:'M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z',p:'M12 5v14M5 12h14',g:'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z',a:'M12 3l9 5-9 5-9-5zM3 13l9 5 9-5',m:'M5 12h.01M12 12h.01M19 12h.01'};
const I=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
let C=null,X={worlds:[],albums:[],photos:[]},sha=null,V={k:'worlds'},stack=[],list=[],vi=0,shown=0,cache=new Map(),dt;
try{C=JSON.parse(localStorage.getItem('g')||'null')}catch(e){}
const H=r=>({Authorization:'Bearer '+C.t,Accept:r?'application/vnd.github.raw+json':'application/vnd.github+json'});
const API=p=>`https://api.github.com/repos/${C.r}/contents/${p}`;

async function blobUrl(p){if(cache.has(p))return cache.get(p);const r=await fetch(API(p),{headers:H(1)});if(!r.ok)throw 0;const u=URL.createObjectURL(await r.blob());cache.set(p,u);if(cache.size>500){const k=cache.keys().next().value;URL.revokeObjectURL(cache.get(k));cache.delete(k)}return u}

function enc(buf){let o='';for(let i=0;i<buf.length;i+=8192)o+=String.fromCharCode.apply(null,buf.subarray(i,i+8192));return btoa(o)}
async function load(){const d=await fetch(API('data'),{headers:H()});if(d.status===404){X={worlds:[],albums:[],photos:[]};sha=null;return}if(!d.ok)throw new Error(d.status);const f=(await d.json()).find(x=>x.name==='index.json');if(!f){sha=null;return}sha=f.sha;const r=await fetch(API('data/index.json'),{headers:H(1)});X=await r.json()}
async function saveIdx(re){const body={message:'index',content:enc(new TextEncoder().encode(JSON.stringify(X))),...(sha?{sha}:{})};const r=await fetch(API('data/index.json'),{method:'PUT',headers:H(),body:JSON.stringify(body)});if(!r.ok){if(!re&&(r.status===409||r.status===422)){const d=await fetch(API('data'),{headers:H()});const f=(await d.json()).find(x=>x.name==='index.json');sha=f?f.sha:null;return saveIdx(1)}throw new Error(r.status)}sha=(await r.json()).content.sha}
const saveSoon=()=>{clearTimeout(dt);dt=setTimeout(()=>saveIdx().catch(()=>toast('Не сохранилось')),1500)};
const rs=(f,m,q)=>new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(),'image/webp',q)};im.onerror=no;im.src=u});
async function put(p,b,sha){const r=await fetch(API(p),{method:'PUT',headers:H(),body:JSON.stringify({message:'+',content:enc(new Uint8Array(await b.arrayBuffer())),...(sha?{sha}:{})})});if(!r.ok)throw new Error(r.status)}
const ensure=(arr,name,extra)=>{let o=arr.find(x=>x.n.toLowerCase()===name.toLowerCase()&&(!extra||x.w===extra.w));if(!o){o={id:'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,4),n:name,...extra};arr.push(o)}return o};
let selOn=false;const SEL=new Set();let busy=false;addEventListener('beforeunload',e=>{if(busy){e.preventDefault();e.returnValue=''}});
const SH=async p=>{try{const r=await fetch(API(p),{headers:H()});return r.ok?(await r.json()).sha:null}catch(e){return null}};
const big=(f,q)=>q===2&&['image/jpeg','image/png','image/webp'].includes(f.type)?Promise.resolve(f):rs(f,q===0?1280:q===1?2048:4096,q===0?.82:.9);
async function upload(files,wn,an,q,redo){const w=ensure(X.worlds,wn),a=ensure(X.albums,an,{w:w.id}),have=new Set(X.photos.filter(p=>p.k).map(p=>p.k));let n=0,sk=0,er=0,wl=null;busy=true;try{wl=await navigator.wakeLock.request('screen')}catch(e){}
 $('#pb').hidden=false;
 for(let i=0;i<files.length;i++){const f=files[i],k=f.name+'|'+f.size+'|'+f.lastModified;$('#pf').style.width=(i/files.length*100)+'%';$('#pt').textContent=`Загрузка ${i+1} из ${files.length}. Не закрывай сайт`;
  const ex=have.has(k)?X.photos.find(p=>p.k===k):null;if(ex&&!redo){sk++;continue}

   if(ex){const pt=`p/${ex.id}_t.webp`,pf=`p/${ex.id}_f.webp`;await put(pt,t,await SH(pt));await put(pf,b,await SH(pf));cache.delete(pt);cache.delete(pf);n++}

const tile=i=>`<button class="tl${SEL.has(list[i].id)?' sel':''}" data-go="p:${i}"><img data-p="p/${list[i].id}_t.webp" alt=""></button>`;

const so=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&more()),{rootMargin:'800px'});
